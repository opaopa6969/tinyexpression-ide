<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyExpression IDE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1e1e1e;
            color: #d4d4d4;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: #252526;
            border-bottom: 1px solid #3c3c3c;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }
        .header h1 {
            font-size: 14px;
            font-weight: 600;
            color: #cccccc;
        }
        .header .status {
            font-size: 12px;
            color: #858585;
        }
        .header .status.connected { color: #89d185; }
        .header .status.error { color: #f48771; }

        /* Main layout */
        .main {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* Editor panel (left) */
        .editor-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 300px;
        }
        #editor-container {
            flex: 1;
        }

        /* Splitter */
        .splitter {
            width: 4px;
            background: #3c3c3c;
            cursor: col-resize;
            flex-shrink: 0;
        }
        .splitter:hover { background: #007acc; }

        /* Preview panel (right) */
        .preview-panel {
            width: 400px;
            display: flex;
            flex-direction: column;
            background: #252526;
            overflow-y: auto;
        }

        .panel-section {
            border-bottom: 1px solid #3c3c3c;
            padding: 12px;
        }
        .panel-section h2 {
            font-size: 12px;
            font-weight: 600;
            color: #858585;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* Variables panel */
        .var-row {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
            align-items: center;
        }
        .var-row label {
            font-size: 13px;
            color: #9cdcfe;
            min-width: 80px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
        }
        .var-row input {
            flex: 1;
            background: #3c3c3c;
            border: 1px solid #4c4c4c;
            color: #d4d4d4;
            padding: 4px 8px;
            font-size: 13px;
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            border-radius: 2px;
        }
        .var-row input:focus {
            outline: none;
            border-color: #007acc;
        }
        .btn-add-var {
            background: #3c3c3c;
            border: 1px solid #4c4c4c;
            color: #d4d4d4;
            padding: 4px 12px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 2px;
        }
        .btn-add-var:hover { background: #4c4c4c; }

        /* Result panel */
        .result-display {
            font-family: 'Cascadia Code', 'Fira Code', monospace;
            font-size: 24px;
            color: #4ec9b0;
            padding: 8px 0;
            word-break: break-all;
        }
        .result-display.error {
            color: #f48771;
            font-size: 14px;
        }
        .result-meta {
            font-size: 12px;
            color: #858585;
            margin-top: 4px;
        }

        /* Railroad diagram */
        .railroad-container {
            background: #1e1e1e;
            border-radius: 4px;
            padding: 8px;
            overflow-x: auto;
            min-height: 60px;
            font-size: 13px;
            color: #858585;
        }

        /* Diagnostics panel */
        .diagnostics-list {
            list-style: none;
            font-size: 12px;
        }
        .diagnostics-list li {
            padding: 4px 0;
            display: flex;
            gap: 8px;
        }
        .diag-error { color: #f48771; }
        .diag-warning { color: #cca700; }
        .diag-info { color: #75beff; }
        .diag-pos {
            color: #858585;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>TinyExpression IDE</h1>
        <span id="lsp-status" class="status">LSP: connecting...</span>
        <span id="eval-status" class="status"></span>
    </div>

    <div class="main">
        <div class="editor-panel">
            <div id="editor-container"></div>
        </div>

        <div class="splitter" id="splitter"></div>

        <div class="preview-panel" id="preview-panel">
            <!-- Variables -->
            <div class="panel-section">
                <h2>Variables</h2>
                <div id="variables-panel"></div>
                <button class="btn-add-var" onclick="addVariable()">+ Add Variable</button>
            </div>

            <!-- Result -->
            <div class="panel-section">
                <h2>Result</h2>
                <div id="result-display" class="result-display">--</div>
                <div id="result-meta" class="result-meta"></div>
            </div>

            <!-- Diagnostics -->
            <div class="panel-section">
                <h2>Diagnostics</h2>
                <ul id="diagnostics-list" class="diagnostics-list">
                    <li class="diag-info">No issues</li>
                </ul>
            </div>

            <!-- Railroad Diagram -->
            <div class="panel-section">
                <h2>Railroad Diagram</h2>
                <div id="railroad-container" class="railroad-container">
                    <em>Enter a formula to see its structure</em>
                </div>
            </div>
        </div>
    </div>

    <!-- Monaco Editor from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>
    <script>
    // ── Configuration ──
    const LSP_WS_URL = `ws://${location.host}/lsp`;
    const EVAL_API_URL = `/api/eval`;
    const EVAL_DEBOUNCE_MS = 300;

    // ── State ──
    let editor = null;
    let lspSocket = null;
    let lspRequestId = 0;
    let lspPendingRequests = {};
    let evalTimer = null;
    let variables = {};

    // ── Monaco Editor Setup ──
    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });

    require(['vs/editor/editor.main'], function () {
        // Register TinyExpression language
        monaco.languages.register({ id: 'tinyexpression' });

        // Simple syntax highlighting (monarch tokenizer)
        monaco.languages.setMonarchTokensProvider('tinyexpression', {
            keywords: [
                'if', 'else', 'match', 'default',
                'var', 'variable', 'as',
                'number', 'string', 'boolean', 'object', 'float',
                'set', 'not', 'exists', 'description', 'call',
                'true', 'false', 'null', 'and', 'or'
            ],
            operators: ['+', '-', '*', '/', '==', '!=', '>=', '<=', '>', '<', '&&', '||', '!'],
            tokenizer: {
                root: [
                    [/\/\/.*$/, 'comment'],
                    [/\/\*/, 'comment', '@comment'],
                    [/\$[a-zA-Z_]\w*/, 'variable'],
                    [/[a-zA-Z_]\w*/, {
                        cases: {
                            '@keywords': 'keyword',
                            '@default': 'identifier'
                        }
                    }],
                    [/[0-9]+(\.[0-9]+)?/, 'number'],
                    [/'[^']*'/, 'string'],
                    [/"[^"]*"/, 'string'],
                    [/[+\-*/=<>!&|]+/, 'operator'],
                    [/[{}()\[\]]/, 'delimiter.bracket'],
                    [/[,;]/, 'delimiter'],
                    [/\s+/, 'white']
                ],
                comment: [
                    [/[^/*]+/, 'comment'],
                    [/\*\//, 'comment', '@pop'],
                    [/./, 'comment']
                ]
            }
        });

        // Define theme colors for TinyExpression
        monaco.editor.defineTheme('tinyexpression-dark', {
            base: 'vs-dark',
            inherit: true,
            rules: [
                { token: 'variable', foreground: '9CDCFE' },
                { token: 'keyword', foreground: 'C586C0' },
                { token: 'number', foreground: 'B5CEA8' },
                { token: 'string', foreground: 'CE9178' },
                { token: 'operator', foreground: 'D4D4D4' },
                { token: 'comment', foreground: '6A9955' }
            ],
            colors: {}
        });

        // Create editor
        editor = monaco.editor.create(document.getElementById('editor-container'), {
            value: '// TinyExpression formula\n1 + $x * 2',
            language: 'tinyexpression',
            theme: 'tinyexpression-dark',
            minimap: { enabled: false },
            fontSize: 14,
            fontFamily: "'Cascadia Code', 'Fira Code', 'Consolas', monospace",
            lineNumbers: 'on',
            scrollBeyondLastLine: false,
            automaticLayout: true,
            tabSize: 2
        });

        // Listen for content changes
        editor.onDidChangeModelContent(() => {
            scheduleEvaluation();
            detectVariables();
        });

        // Initial setup
        detectVariables();
        connectLsp();
        scheduleEvaluation();
    });

    // ── LSP WebSocket Connection ──
    function connectLsp() {
        const statusEl = document.getElementById('lsp-status');

        try {
            lspSocket = new WebSocket(LSP_WS_URL);
        } catch (e) {
            statusEl.textContent = 'LSP: failed to connect';
            statusEl.className = 'status error';
            return;
        }

        lspSocket.onopen = () => {
            statusEl.textContent = 'LSP: connected';
            statusEl.className = 'status connected';
            // Send initialize request
            sendLspRequest('initialize', {
                processId: null,
                capabilities: {
                    textDocument: {
                        completion: { completionItem: { snippetSupport: true } },
                        hover: {},
                        publishDiagnostics: {}
                    }
                },
                rootUri: null
            }).then(result => {
                // Send initialized notification
                sendLspNotification('initialized', {});
                // Open the document
                sendDocumentOpen();
            });
        };

        lspSocket.onmessage = (event) => {
            try {
                const msg = JSON.parse(event.data);
                handleLspMessage(msg);
            } catch (e) {
                console.warn('Failed to parse LSP message:', e);
            }
        };

        lspSocket.onclose = () => {
            statusEl.textContent = 'LSP: disconnected';
            statusEl.className = 'status error';
            // Reconnect after 3 seconds
            setTimeout(connectLsp, 3000);
        };

        lspSocket.onerror = (err) => {
            statusEl.textContent = 'LSP: error';
            statusEl.className = 'status error';
            console.error('LSP WebSocket error:', err);
        };
    }

    function sendLspRequest(method, params) {
        return new Promise((resolve, reject) => {
            const id = ++lspRequestId;
            lspPendingRequests[id] = { resolve, reject };
            const msg = JSON.stringify({ jsonrpc: '2.0', id, method, params });
            if (lspSocket && lspSocket.readyState === WebSocket.OPEN) {
                lspSocket.send(msg);
            }
        });
    }

    function sendLspNotification(method, params) {
        const msg = JSON.stringify({ jsonrpc: '2.0', method, params });
        if (lspSocket && lspSocket.readyState === WebSocket.OPEN) {
            lspSocket.send(msg);
        }
    }

    function handleLspMessage(msg) {
        // Response to a request
        if (msg.id !== undefined && lspPendingRequests[msg.id]) {
            const { resolve, reject } = lspPendingRequests[msg.id];
            delete lspPendingRequests[msg.id];
            if (msg.error) {
                reject(msg.error);
            } else {
                resolve(msg.result);
            }
            return;
        }

        // Server notification
        if (msg.method) {
            switch (msg.method) {
                case 'textDocument/publishDiagnostics':
                    handleDiagnostics(msg.params);
                    break;
                default:
                    console.log('LSP notification:', msg.method);
            }
        }
    }

    function sendDocumentOpen() {
        if (!editor) return;
        sendLspNotification('textDocument/didOpen', {
            textDocument: {
                uri: 'inmemory://formula.te',
                languageId: 'tinyexpression',
                version: 1,
                text: editor.getValue()
            }
        });
    }

    let docVersion = 1;
    function sendDocumentChange() {
        if (!editor) return;
        docVersion++;
        sendLspNotification('textDocument/didChange', {
            textDocument: {
                uri: 'inmemory://formula.te',
                version: docVersion
            },
            contentChanges: [{ text: editor.getValue() }]
        });
    }

    // ── Diagnostics ──
    function handleDiagnostics(params) {
        const listEl = document.getElementById('diagnostics-list');
        const diagnostics = params.diagnostics || [];

        if (diagnostics.length === 0) {
            listEl.innerHTML = '<li class="diag-info">No issues</li>';
            // Clear Monaco markers
            if (editor) {
                monaco.editor.setModelMarkers(editor.getModel(), 'lsp', []);
            }
            return;
        }

        listEl.innerHTML = '';
        const markers = [];

        diagnostics.forEach(d => {
            const severity = d.severity === 1 ? 'error' : d.severity === 2 ? 'warning' : 'info';
            const li = document.createElement('li');
            li.className = `diag-${severity}`;
            const pos = `${d.range.start.line + 1}:${d.range.start.character + 1}`;
            li.innerHTML = `<span class="diag-pos">[${pos}]</span> ${escapeHtml(d.message)}`;
            listEl.appendChild(li);

            // Monaco marker
            markers.push({
                severity: d.severity === 1 ? monaco.MarkerSeverity.Error
                        : d.severity === 2 ? monaco.MarkerSeverity.Warning
                        : monaco.MarkerSeverity.Info,
                startLineNumber: d.range.start.line + 1,
                startColumn: d.range.start.character + 1,
                endLineNumber: d.range.end.line + 1,
                endColumn: d.range.end.character + 1,
                message: d.message,
                source: d.source || 'lsp'
            });
        });

        if (editor) {
            monaco.editor.setModelMarkers(editor.getModel(), 'lsp', markers);
        }
    }

    // ── Evaluation ──
    function scheduleEvaluation() {
        if (evalTimer) clearTimeout(evalTimer);
        evalTimer = setTimeout(doEvaluation, EVAL_DEBOUNCE_MS);
        // Also send document change to LSP
        sendDocumentChange();
    }

    async function doEvaluation() {
        if (!editor) return;
        const formula = editor.getValue();
        const statusEl = document.getElementById('eval-status');
        const resultEl = document.getElementById('result-display');
        const metaEl = document.getElementById('result-meta');

        // Skip comment-only or empty formulas
        const stripped = formula.replace(/\/\/.*$/gm, '').replace(/\/\*[\s\S]*?\*\//g, '').trim();
        if (!stripped) {
            resultEl.textContent = '--';
            resultEl.className = 'result-display';
            metaEl.textContent = '';
            return;
        }

        statusEl.textContent = 'evaluating...';

        try {
            const resp = await fetch(EVAL_API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    formula: stripped,
                    variables: variables,
                    resultType: 'number'
                })
            });

            const data = await resp.json();

            if (data.error) {
                resultEl.textContent = data.error;
                resultEl.className = 'result-display error';
                metaEl.textContent = '';
            } else {
                resultEl.textContent = data.result;
                resultEl.className = 'result-display';
                metaEl.textContent = data.substituted ? `substituted: ${data.substituted}` : '';
            }
            statusEl.textContent = '';
        } catch (e) {
            resultEl.textContent = 'Network error';
            resultEl.className = 'result-display error';
            statusEl.textContent = '';
        }

        // Update railroad diagram
        updateRailroadDiagram(stripped);
    }

    // ── Variable Detection & Panel ──
    function detectVariables() {
        if (!editor) return;
        const text = editor.getValue();
        const varPattern = /\$([a-zA-Z_]\w*)/g;
        const found = new Set();
        let match;
        while ((match = varPattern.exec(text)) !== null) {
            found.add(match[1]);
        }

        // Add new variables, keep existing values
        const newVars = {};
        for (const name of found) {
            newVars[name] = variables[name] || '0';
        }
        variables = newVars;
        renderVariablesPanel();
    }

    function renderVariablesPanel() {
        const panel = document.getElementById('variables-panel');
        panel.innerHTML = '';

        for (const [name, value] of Object.entries(variables)) {
            const row = document.createElement('div');
            row.className = 'var-row';

            const label = document.createElement('label');
            label.textContent = '$' + name;
            row.appendChild(label);

            const input = document.createElement('input');
            input.type = 'text';
            input.value = value;
            input.dataset.varName = name;
            input.addEventListener('input', (e) => {
                variables[name] = e.target.value;
                scheduleEvaluation();
            });
            row.appendChild(input);

            panel.appendChild(row);
        }
    }

    function addVariable() {
        const name = prompt('Variable name (without $):');
        if (name && /^[a-zA-Z_]\w*$/.test(name)) {
            variables[name] = '0';
            renderVariablesPanel();
            scheduleEvaluation();
        }
    }

    // ── Railroad Diagram (simple text-based for MVP) ──
    function updateRailroadDiagram(formula) {
        const container = document.getElementById('railroad-container');

        // Simple structural display for MVP
        // A full railroad diagram requires a grammar → SVG renderer
        const tokens = tokenize(formula);
        if (tokens.length === 0) {
            container.innerHTML = '<em>Enter a formula to see its structure</em>';
            return;
        }

        let html = '<div style="display:flex;align-items:center;gap:4px;flex-wrap:wrap;">';
        for (const tok of tokens) {
            const cls = tok.type === 'op' ? 'color:#d4d4d4;background:#3c3c3c'
                      : tok.type === 'num' ? 'color:#b5cea8'
                      : tok.type === 'var' ? 'color:#9cdcfe'
                      : tok.type === 'kw' ? 'color:#c586c0'
                      : tok.type === 'str' ? 'color:#ce9178'
                      : 'color:#d4d4d4';
            html += `<span style="padding:2px 6px;border-radius:3px;border:1px solid #4c4c4c;font-family:monospace;font-size:12px;${cls}">${escapeHtml(tok.value)}</span>`;
            html += '<span style="color:#4c4c4c;">&#x2192;</span>';
        }
        // Remove trailing arrow
        html = html.replace(/&#x2192;<\/span>$/, '</span>');
        html += '</div>';
        container.innerHTML = html;
    }

    function tokenize(formula) {
        const keywords = new Set(['if','else','match','default','var','variable','as','number','string','boolean','object','float','set','not','exists','true','false','null','and','or']);
        const tokens = [];
        const re = /(\$[a-zA-Z_]\w*)|([a-zA-Z_]\w*)|([0-9]+(?:\.[0-9]+)?)|('[^']*'|"[^"]*")|([+\-*/=<>!&|]+)|([(){}[\],;])|(\s+)/g;
        let m;
        while ((m = re.exec(formula)) !== null) {
            if (m[7]) continue; // skip whitespace
            if (m[1]) tokens.push({ type: 'var', value: m[1] });
            else if (m[2]) tokens.push({ type: keywords.has(m[2]) ? 'kw' : 'id', value: m[2] });
            else if (m[3]) tokens.push({ type: 'num', value: m[3] });
            else if (m[4]) tokens.push({ type: 'str', value: m[4] });
            else if (m[5]) tokens.push({ type: 'op', value: m[5] });
            else if (m[6]) tokens.push({ type: 'op', value: m[6] });
        }
        return tokens;
    }

    // ── Splitter drag ──
    (function() {
        const splitter = document.getElementById('splitter');
        const preview = document.getElementById('preview-panel');
        let dragging = false;

        splitter.addEventListener('mousedown', (e) => {
            dragging = true;
            document.body.style.cursor = 'col-resize';
            e.preventDefault();
        });

        document.addEventListener('mousemove', (e) => {
            if (!dragging) return;
            const containerRect = document.querySelector('.main').getBoundingClientRect();
            const newWidth = containerRect.right - e.clientX;
            preview.style.width = Math.max(200, Math.min(800, newWidth)) + 'px';
        });

        document.addEventListener('mouseup', () => {
            dragging = false;
            document.body.style.cursor = '';
        });
    })();

    // ── Utilities ──
    function escapeHtml(str) {
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    </script>
</body>
</html>
